<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Photo Excel Sheet</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div>
    <h1>Photo Excel Sheet</h1>
    <div class="sub">Enter data, capture/select photos, and save everything as Excel.</div>
  </div>
  <div class="actions">
    <button id="newBtn">New</button>
    <label class="button secondary">Open Excel<input id="openInput" type="file" accept=".xlsx"></label>
    <button id="downloadBtn" class="primary">Download Excel</button>
  </div>
</header>

<main>
  <div class="toolbar">
    <button id="addRowBtn">＋ Add row</button>
    <button id="deleteRowsBtn">Delete selected rows</button>
    <span id="status"></span>
  </div>
  <div class="sheet-wrap">
    <table id="sheet">
      <thead><tr>
        <th class="check"><input id="selectAll" type="checkbox"></th>
        <th>#</th><th>Column 1</th><th>Column 2</th><th>Column 3</th>
        <th>Column 4</th><th>Column 5</th><th>Photo</th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </div>
</main>

<div id="photoMenu" class="modal hidden">
  <div class="modal-card">
    <h2>Add photo</h2>
    <button id="cameraBtn" class="primary big">📷 Take photo</button>
    <button id="galleryBtn" class="big">🖼️ Select photo</button>
    <button id="cancelPhoto" class="text-btn">Cancel</button>
  </div>
</div>
<input id="cameraInput" type="file" accept="image/*" capture="environment" hidden>
<input id="galleryInput" type="file" accept="image/*" hidden>

<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script src="app.js"></script>
</body>
</html>
